# Continuous integration for the data-preparation code.
# Runs on every push and pull request. Needs no dataset: the tests build a small
# synthetic Kvasir-style dataset and check the split files that are committed.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q src tests

      - name: Run unit and pipeline tests
        run: python -m unittest discover -s tests -v

      - name: Check split files are untouched by the tests
        run: git diff --exit-code -- splits/
